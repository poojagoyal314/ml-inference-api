services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./model.joblib:/app/model.joblib
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://iris:irispass@db:5432/irisdb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=iris
      - POSTGRES_PASSWORD=irispass
      - POSTGRES_DB=irisdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
